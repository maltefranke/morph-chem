defaults:
  - _self_
  # Single-knob presets bundle
  # `data` + `embeddings` (with dataset-tuned ExtrapolatableCount params)
  # plus the shared `core` group selections. Override individual groups as
  # usual, e.g. `defaults=qm9/qm9 model=backbones/dit`.
  - defaults: geom/geom

# What the model trains on. Datasets declare their CAPABILITIES; run.py validates
# the requested mode against them before preprocessing.
#   pointcloud         — x, a only (charges and edges are dummy singletons)
#   charged_pointcloud — x, a, c   (edges are dummy singletons)
#   geometric_graph    — x, a, edge_index, e (charges are dummy neutral)
#   molecule           — full chemistry (current behavior)
representation: molecule
seed: 42

# Run directory: <root>/<dataset>/<cfg_method>/<date>/<wandb_id>. Root is
# MORPH_RUN_ROOT (scratch, set in .env) so every run's outputs/checkpoints/wandb
# land off-repo; falls back to <cwd>/outputs for ad-hoc runs with no env set.
# wandb id is MORPH_RUN_ID (same as WANDB_RUN_ID). Set in the shell before
# torchrun, or set automatically for single-process runs in run.py before Hydra composes.
hydra:
  run:
    dir: ${oc.env:MORPH_RUN_ROOT,${hydra:runtime.cwd}/outputs}/${hydra:runtime.choices.data}/${now:%Y-%m-%d}/${oc.env:MORPH_RUN_ID}

# @package _global_
# QM9 preset: shared core + QM9 data and embeddings.
defaults:
  - /defaults/core
  - /data: qm9/qm9
  - /embeddings: qm9
  - _self_

trainer:
  trainer:
    check_val_every_n_epoch: 1

# Keep the full 25-epoch checkpoint history for model releases and resuming.
callbacks:
  model_checkpoints:
    every_n_epochs: 25
  every_n_epochs_checkpoint:
    every_n_epochs: 25
    save_top_k: -1
    save_last: link

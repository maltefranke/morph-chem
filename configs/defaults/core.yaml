# @package _global_
# Shared default groups that don't change between QM9 / GEOM runs.
# Dataset-specific presets (defaults/qm9/qm9.yaml, defaults/geom/geom.yaml) inherit
# from this and only add `data` + `embeddings`.
defaults:
  - /heads: head
  - /insertion_head: unimodal
  - /model: backbones/dit
  - /schedule: smoothstep
  - /trainer: trainer
  - /callbacks: callbacks
  - /logging: wandb_logger
  - /integrator: integrator

# GEOM-Drugs data config for the **scaffold decoration** task.
#
# Mirrors configs/data/qm9/scaffold_decoration.yaml but on GEOM-Drugs: source
# is the selected scaffold of each target; target is the full molecule. The model
# learns to grow decoration atoms while denoising the retained scaffold.
#
# Inherits from configs/data/geom/geom.yaml and overrides:
#   - datamodule._target_ -> ScaffoldLightningDataModule
#
# The scaffold cache is built lazily into ``scaffold_groups_dir`` on first run
# (one file per split and scaffold kind) and reused afterwards.
defaults:
  - /data/geom/geom@_here_
  - _self_

scaffold_groups_dir: ${data.preprocessing.root}/processed/scaffold_groups
scaffold_kind: rgroup # murcko, rgroup (BRICS), heavy (generate H), linker
# Physical Angstroms, per coordinate axis. Used only by training interpolation.
jitter_scale: 0.1
# "substituent" restricts insertion parents to the target branch or its
# scaffold attachments. This changes training supervision, not atom OT.
insertion_assignment: nearest
interpolator:
  jitter_scale: ${data.jitter_scale}
  insertion_assignment: ${data.insertion_assignment}
# Exhaustive evaluation when eval_panel=null; training always draws randomly.
enumerate_slicings: false
eval_panel:
  directory: ${data.scaffold_groups_dir}/eval_panels
  n_scaffolds: 512
  samples_per_scaffold: 8
  seed: 42
datamodule:
  _target_: morph.dataset.conditional.scaffold.datamodule.ScaffoldLightningDataModule
  scaffold_groups_dir: ${data.scaffold_groups_dir}
  scaffold_kind: ${data.scaffold_kind}
  enumerate_slicings: ${data.enumerate_slicings}
  eval_panel: ${data.eval_panel}

# Shared drug-like molecular training and preprocessing configuration.

root_path: ${oc.env:PROJECT_ROOT}/data
preprocess_workers: 10
preprocess_chunk_size: 128
statistics_workers: ${data.preprocess_workers}
hydrogen_mode: explicit
# The mode is part of the cache path; changing it discovers fresh vocab/statistics.
cache_name: ${data.dataset_name}${if:${eq:${data.hydrogen_mode},implicit},_implicit_h,''}
source_dir: null
max_atoms: null
allowed_atom_symbols: null

n_atoms_strategy: "uniform" # "approx", "empirical", "learned"
# Uniform source-count support padding; explicit so inference and training can
# be matched or ablated without code changes.
uniform_n_atoms_padding: 5
optimal_transport: "equivariant"
# Physical Angstroms (converted to normalized coordinates internally). These
# reproduce the former normalized 0.25 / 0.2 scales at GEOM's training-set std.
# Physical Angstroms. Insertion bridge noise vanishes as (1-t); move noise is
# the persistent training-time jitter floor for matched atoms and insertions
# that are already present.
ins_noise_scale: 0.65
move_noise_scale: 0.5

# Drug-like datasets contain charged species; allow them in validity metrics.
allow_charged: true


# Preprocessing configuration - computes tokens from data and distributions from training dataset only
preprocessing:
  _target_: morph.dataset.core.preprocessing.Preprocessing
  _recursive_: false
  root: ${data.root_path}/${data.cache_name}
  num_workers: ${data.statistics_workers}
  train_dataset: ${data.datamodule.datasets.train}
  atom_tokens_path: ${data.preprocessing.root}/processed/atom_tokens.txt
  edge_tokens_path: ${data.preprocessing.root}/processed/edge_tokens.txt
  charge_tokens_path: ${data.preprocessing.root}/processed/charge_tokens.txt
  distributions_path: ${data.preprocessing.root}/processed/distributions.pt
  # Tokens and distributions will be discovered from data and saved to files
  # On subsequent runs, they will be loaded from the files

vocab: null

interpolator:
  _target_: morph.flow_matching.interpolation.Interpolator
  distributions: null
  optimal_transport: ${data.optimal_transport}
  ins_noise_scale: ${data.ins_noise_scale}
  move_noise_scale: ${data.move_noise_scale}
  # Expose the aligned source graph as mol_t.contexts["prior"] during training.
  include_prior_context: false
  # Training-only categorical corruption; pairs are scaled per molecule to
  # match the expected number of changed atoms. Clean targets stay unchanged.
  atom_type_noise_prob: 0.0
  # OT matching (cost always squared-Euclidean; move cost in Angstrom). c_move
  # scales the squared move distance (A^2); c_ins/c_del/c_sub are fixed A^2 costs,
  # directly comparable. At 6.125 each, delete+insert costs 3.5^2, so atoms
  # farther than 3.5 A apart are left unmatched by default.
  pre_align_iters: 2   # equivariant-OT inner loop (Hungarian+Kabsch) iters
  c_move: 1.0
  c_sub: 0.0
  c_ins: 6.125
  c_del: 6.125
  del_schedule: ${schedule}
  ins_schedule: ${schedule}
  sub_schedule:
    _target_: morph.flow_matching.schedules.SmoothstepSchedule
    shift: 1.5
  sub_e_schedule:
    _target_: morph.flow_matching.schedules.SmoothstepSchedule
    shift: 1.5

datamodule:
  _target_: morph.dataset.core.lightning_datamodule.LightningDataModule
  # tokens and distributions will be passed from preprocessing in run.py

  vocab: ${data.vocab}
  distributions: null
  representation: ${representation}

  datasets:
    train:
      _target_: ${data.dataset_target}
      root: ${data.preprocessing.root}
      preprocess_workers: ${data.preprocess_workers}
      preprocess_chunk_size: ${data.preprocess_chunk_size}
      hydrogen_mode: ${data.hydrogen_mode}
      source_dir: ${data.source_dir}
      max_atoms: ${data.max_atoms}
      allowed_atom_symbols: ${data.allowed_atom_symbols}
      vocab: ${data.vocab}
      distributions: null

    val:
      - _target_: ${data.dataset_target}
        root: ${data.preprocessing.root}
        preprocess_workers: ${data.preprocess_workers}
        preprocess_chunk_size: ${data.preprocess_chunk_size}
        hydrogen_mode: ${data.hydrogen_mode}
        source_dir: ${data.source_dir}
        max_atoms: ${data.max_atoms}
        allowed_atom_symbols: ${data.allowed_atom_symbols}
        vocab: ${data.vocab}
        distributions: null

    test:
      - _target_: ${data.dataset_target}
        root: ${data.preprocessing.root}
        preprocess_workers: ${data.preprocess_workers}
        preprocess_chunk_size: ${data.preprocess_chunk_size}
        hydrogen_mode: ${data.hydrogen_mode}
        source_dir: ${data.source_dir}
        max_atoms: ${data.max_atoms}
        allowed_atom_symbols: ${data.allowed_atom_symbols}
        vocab: ${data.vocab}
        distributions: null

  interpolator: ${data.interpolator}

  rotate: ${model.rotate}
  n_augmentations: ${model.n_augmentations}

  num_workers:
    train: 10
    val: 0
    test: 0

  batch_size:
    train: 320
    val: 128
    test: 64

  n_atoms_strategy: ${data.n_atoms_strategy}
  uniform_n_atoms_padding: ${data.uniform_n_atoms_padding}
  time_dist: ${model.module.time_dist}

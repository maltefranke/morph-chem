# @package model.module.optimizer_config
# Muon + auxiliary AdamW preset for the molecular DiT. Per-run overrides
# go on ``model.module.optimizer_config``:
#   model.module.optimizer_config.optimizer.lr=0.005 ...
implementation: torch

optimizer:
  # no _target_ -> triggers Muon path in configure_optimizers
  # Set MORPH_MUON_EXECUTION=cuda_graph to opt into CUDA graph replay.
  execution: ${oc.env:MORPH_MUON_EXECUTION,native}
  lr: 0.01
  momentum: 0.95
  weight_decay: 0.0
  nesterov: true
  ns_steps: 5
  eps: 1e-7
  adjust_lr_fn: original

aux_optimizer:
  lr: 3e-4
  betas: [0.9, 0.95]
  eps: 1e-10
  weight_decay: 0.0

# Lightning's two-optimizer path uses manual optimization, so clipping is
# configured here and applied once to the full model gradient.
gradient_clip_val: 1.0
gradient_clip_algorithm: norm

scheduler:
  _target_: morph.utils.lr_schedulers.MultiGroupCosineWarmupLR
  # configure_optimizers injects each native optimizer here.
  warmup_steps: 2000        # Typically 2-5% of total_steps
  total_steps: 200000        # The total number of training iterations
  min_lr_fraction: 0.05      # Decays to 5% of each optimizer's peak LR
  last_epoch: -1

interval: step
monitor: null
